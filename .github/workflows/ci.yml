name: Check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install -r services/api/requirements.lock
          python -m pip install --no-deps -e services/api
      - name: Install web dependencies
        run: npm ci
      - name: Check API and contracts
        run: |
          python -m pytest services/api/tests
          npm run contracts:check
      - name: Check and build web
        run: |
          npm run test:web
          npm run typecheck
          npm run build
